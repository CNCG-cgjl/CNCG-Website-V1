# v1.1+ 持续集成：构建校验，防止空包或坏包进入发布流程
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Verify dist integrity
        run: |
          set -e
          test -f dist/index.html
          JS_BYTES=$(find dist/assets -name '*.js' -type f -print0 | xargs -0 cat | wc -c)
          echo "Total JS bytes: $JS_BYTES"
          test "$JS_BYTES" -gt 100000
          if grep -rE 'SUPABASE_SERVICE_ROLE_KEY|FEISHU_APP_SECRET=[A-Za-z0-9]{16,}' dist/ 2>/dev/null; then
            echo "SECURITY: forbidden pattern in dist"
            exit 1
          fi
          echo "dist verification passed"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14
