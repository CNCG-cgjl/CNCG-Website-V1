<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 基础 SEO -->
    <meta name="description" content="CNCG - 专注网站开发、内容创作与数字化解决方案，提供Vue3开发、技术咨询、博客文章与开源知识库" />
    <meta name="keywords" content="CNCG,网站开发,前端开发,Vue3,博客,技术咨询,数字化解决方案,飞书,知识库" />
    <meta name="author" content="CNCG" />
    <link rel="canonical" href="https://cncg.me/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph -->
    <meta property="og:title" content="CNCG | 网站开发 · 内容创作 · 数字化解决方案" />
    <meta property="og:description" content="专注网站开发、内容创作与数字化解决方案。博客、笔记、知识库、在线店铺，一站聚合。" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:site_name" content="CNCG" />
    <meta property="og:url" content="https://cncg.me/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CNCG | 网站开发 · 内容创作 · 数字化解决方案" />
    <meta name="twitter:description" content="专注网站开发、内容创作与数字化解决方案" />

    <!-- ========== 结构化数据 (JSON-LD) ========== -->
    <!-- WebSite Schema — 让搜索引擎理解站点结构 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "CNCG",
      "alternateName": "长歌工作室",
      "url": "https://cncg.me",
      "description": "专注网站开发、内容创作与数字化解决方案",
      "inLanguage": "zh-CN",
      "publisher": {
        "@type": "Person",
        "name": "CNCG",
        "url": "https://cncg.me/about"
      }
    }
    </script>

    <!-- Person Schema — 作者信息 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "CNCG",
      "url": "https://cncg.me",
      "jobTitle": "全栈开发者 & 内容创作者",
      "sameAs": [
        "https://github.com/CNCG-dev"
      ],
      "knowsAbout": ["Vue.js", "JavaScript", "前端开发", "网站设计", "飞书"]
    }
    </script>

    <!-- Service Schema — 服务信息 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "name": "CNCG 远程技术服务",
      "description": "专注网站开发、内容创作与数字化解决方案，提供Vue3开发、技术咨询、远程协助等专业服务",
      "provider": {
        "@type": "Person",
        "name": "CNCG",
        "url": "https://cncg.me"
      },
      "areaServed": "CN",
      "serviceType": "远程技术服务",
      "url": "https://cncg.me/shop"
    }
    </script>

    <!-- 使用内联 SVG 图标，暂不引用外部 iconfont -->

    <!-- DNS Prefetch — 预解析外部域名加速连接 -->
    <link rel="dns-prefetch" href="//at.alicdn.com" />
    <link rel="dns-prefetch" href="//open.feishu.cn" />

    <!-- Preconnect 关键资源 -->
    <link rel="preconnect" href="https://open.feishu.cn" crossorigin />

    <title>CNCG | 网站开发 · 内容创作 · 数字化解决方案</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
